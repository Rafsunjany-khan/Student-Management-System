{% extends 'base.html' %}
{% block content %}
        <div class="d-flex justify-content-center gap-3 mb-3">
            <a href="{% url 'student_list' %}" class="btn btn-outline-primary">Home</a>
            <a href="{% url 'student_create' %}" class="btn btn-primary">Add Student</a>
        </div>

<h2 class="mb-4">Student List</h2>

<!-- Table Container -->
<div class="table-responsive">
    <table class="table table-bordered table-striped table-hover">
        <thead class="table-light">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.phone }}</td>
                <td>{{ student.course }}</td>
                <td>
                    <a href="{% url 'student_detail' student.id %}" class="btn btn-success btn-sm">View</a>
                    <a href="{% url 'student_update' student.id %}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{% url 'student_delete' student.id %}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this student?')">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">No students found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
