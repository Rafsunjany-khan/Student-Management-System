{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white text-center">
                    <h2 class="mb-0 fw-bold fs-3">{% if form.instance.pk %} Edit {% else %} Add {% endif %} Student</h2>
                </div>
                <div class="card-body">
                    <form method="POST" action="{% if form.instance.pk %}{% url 'student_update' form.instance.id %}{% else %}{% url 'student_create' %}{% endif %}">
                        {% csrf_token %}

                        <!-- Render the form fields with larger text size -->
                        <div class="mb-4">
                            {% for field in form %}
                                <div class="mb-4">
                                    <label for="{{ field.id_for_label }}" class="form-label fs-5 fw-bold">{{ field.label }}</label>
                                    {{ field }}
                                    {% for error in field.errors %}
                                        <div class="alert alert-danger mt-2">{{ error }}</div>
                                    {% endfor %}
                                </div>
                            {% endfor %}
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <!-- Buttons with small size, consistent and visually appealing -->
                            <button type="submit" class="btn btn-sm {% if form.instance.pk %} btn-warning {% else %} btn-success {% endif %}">
                                {% if form.instance.pk %} Update {% else %} Submit {% endif %}
                            </button>
                            <a href="{% url 'student_list' %}" class="btn btn-sm btn-secondary">Back to List</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
