{% extends 'base.html' %}

{% block content %}
<div class="container">
<div class="card position-relative">
            <!-- Profile Image at the Right-Top Corner -->
            <div class="position-absolute mt-2 top-0 end-0 p-3">
                <i class="bi bi-person-circle" style="font-size: 120px; color: #007bff;"></i>
            </div>

            <div class="card-header bg-primary text-white">
                <h2 class="mb-0 fw-bold">Student Profile</h2>
            </div>

            <div class="card-body">
                <!-- Student Information (Left Side) -->
                <div>
                    <h4 class="fw-bold text-primary">Student Information</h4>
                    <ul class="list-unstyled fs-5">
                        <li><strong>Name:</strong> {{ student.name }}</li>
                        <li><strong>Email:</strong> {{ student.email }}</li>
                        <li><strong>Phone:</strong> {{ student.phone }}</li>
                        <li><strong>Course:</strong> {{ student.course }}</li>
                    </ul>
                </div>

                <!-- Action Buttons (Aligned Right) -->
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <a href="{% url 'student_list' %}" class="btn btn-outline-secondary btn-lg">Back to List</a>
                    <a href="{% url 'student_update' student.id %}" class="btn btn-warning btn-lg">Edit</a>
                    <a href="{% url 'student_delete' student.id %}" class="btn btn-danger btn-lg"
                       onclick="return confirm('Are you sure you want to delete this student?')">Delete</a>
                </div>
            </div>
        </div>
</div>
{% endblock %}
